<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="bg-background dark:bg-background border-b border-outline-variant docked full-width top-0 z-50">
<div class="flex justify-between items-center w-full px-lg py-sm max-w-container-max mx-auto h-16">
<div class="flex items-center gap-md">
<span class="font-headline-md text-headline-md font-bold text-on-background dark:text-on-background">CodeScope AI</span>
</div>
<div class="hidden md:flex items-center gap-lg">
<a class="font-headline-sm text-headline-sm text-on-surface-variant hover:bg-surface-container-high transition-colors px-md py-xs rounded" href="#">Dashboard</a>
<a class="font-headline-sm text-headline-sm text-on-surface-variant hover:bg-surface-container-high transition-colors px-md py-xs rounded" href="#">Reviews</a>
<a class="font-headline-sm text-headline-sm text-on-surface-variant hover:bg-surface-container-high transition-colors px-md py-xs rounded" href="#">Enterprise</a>
</div>
<div class="flex items-center gap-sm">
<button class="p-xs rounded hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary">help</span>
</button>
<button class="p-xs rounded hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined text-primary">settings</span>
</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-gutter py-2xl relative overflow-hidden">
<!-- Structural Background Element -->
<div class="absolute inset-0 opacity-10 pointer-events-none" style="background-image: radial-gradient(#3B82F6 0.5px, transparent 0.5px); background-size: 24px 24px;"></div>
<!-- Registration Card -->
<div class="w-full max-w-[440px] bg-[#1E1E1E] technical-border p-xl shadow-2xl relative z-10 rounded-lg">
<div class="mb-xl">
<h1 class="font-headline-lg text-headline-lg mb-xs tracking-tight">CodeScope AI</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Create your account</p>
</div>
<form action="#" class="space-y-lg" onsubmit="event.preventDefault()">
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">NAME</label>
<input class="w-full bg-[#121212] technical-border active-input px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant rounded" placeholder="Enter Name" type="text"/>
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">EMAIL ADDRESS</label>
<input class="w-full bg-[#121212] technical-border active-input px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant rounded" placeholder="Enter Email" type="email"/>
</div>
<div class="space-y-sm">
<label class="font-label-caps text-label-caps text-on-surface-variant block">PASSWORD</label>
<input class="w-full bg-[#121212] technical-border active-input px-md py-sm font-body-md text-body-md text-on-surface placeholder:text-outline-variant rounded" placeholder="Enter Password" type="password"/>
</div>
<div class="pt-md">
<button class="w-full bg-[#3B82F6] hover:bg-[#2563EB] active:opacity-80 transition-all text-white font-label-sm text-label-sm py-md font-bold tracking-widest rounded-lg" type="submit">
                        CREATE ACCOUNT
                    </button>
</div>
</form>
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary hover:underline transition-all" href="#">Login</a>
</p>
</div>
<!-- Technical Detail Ornament -->
<div class="absolute top-0 right-0 p-sm opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[12px]">developer_board</span>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-background dark:bg-background border-t border-outline-variant docked full-width bottom-0">
<div class="flex flex-col md:flex-row justify-between items-center w-full px-lg py-md max-w-container-max mx-auto gap-md">
<div class="flex flex-col md:flex-row items-center gap-md">
<span class="font-label-caps text-label-caps text-on-surface-variant">CODESCOPE_SYSTEM_V4</span>
<span class="font-label-sm text-label-sm text-secondary dark:text-secondary">© 2024 CodeScope AI. Technical Functionalism.</span>
</div>

<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Security</a>
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Status</a>
</div>
</div>
</footer>
<script>
        // Simple micro-interaction for input focus states
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.replace('text-on-surface-variant', 'text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.replace('text-primary', 'text-on-surface-variant');
            });
        });
    </script>
